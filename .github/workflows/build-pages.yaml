name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CLOUDFLARE_PROJECT_NAME: nutritionarchive   # <-- change this to your actual Pages project name

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Verify Cloudflare credentials + project exist BEFORE we
  #    spend time generating 8K pages. Fails fast and cheaply.
  # ────────────────────────────────────────────────────────────
  verify-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets are present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set."
            exit 1
          fi

      - name: Verify Wrangler can authenticate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami

      - name: Install wrangler CLI directly (for scripted checks)
        run: npm install -g wrangler

      - name: Verify the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list | grep -q "${{ env.CLOUDFLARE_PROJECT_NAME }}"; then
            echo "::error::Cloudflare Pages project '${{ env.CLOUDFLARE_PROJECT_NAME }}' was not found on this account."
            exit 1
          fi
          echo "Project '${{ env.CLOUDFLARE_PROJECT_NAME }}' confirmed. Safe to proceed to build."

  # ────────────────────────────────────────────────────────────
  # 2. Build — only runs if verify-cloudflare succeeded
  # ────────────────────────────────────────────────────────────
  build:
    needs: verify-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (generates all 8K static pages)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: out          # <-- change if your export dir is different (e.g. .vercel/output, dist)
          retention-days: 1

  # ────────────────────────────────────────────────────────────
  # 3. Deploy — only runs if build succeeded
  # ────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}